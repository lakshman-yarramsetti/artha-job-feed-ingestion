services:
  app:
    build:
      context: .
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: artha_job_feed
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
    command: ./node_modules/.bin/tsx watch src/main.ts

  mongo:
    image: mongo:8.0
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mongo_data:
